<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
</head>
<body>

<h2>Register</h2>
<input id="ruser" placeholder="Username">
<input id="rpass" placeholder="Password" type="password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="luser" placeholder="Username">
<input id="lpass" placeholder="Password" type="password">
<button onclick="login()">Login</button>

<p id="result"></p>

<script>
const baseURL = "https://my-website-1-qnah.onrender.com"; // apna link

async function register() {
  const res = await fetch(baseURL + "/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("ruser").value,
      password: document.getElementById("rpass").value
    })
  });
  document.getElementById("result").innerText = await res.text();
}

async function login() {
  const res = await fetch(baseURL + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("luser").value,
      password: document.getElementById("lpass").value
    })
  });
  document.getElementById("result").innerText = await res.text();
}
</script>

</body>
</html>
